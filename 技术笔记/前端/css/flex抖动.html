<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex溢出抖动</title>
    <style>
        /* 祖父宽高固定了 */
        .fix-box {
            width: 300px;
            height: 300px;
            background-color: black;
            margin-top: 0 20px;
        }

        .parent-box {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blue;
            flex-direction: column;
        }
        
        /* 孙子宽高固定 */
        .child-box {
            height: 200px;
            width: 150px;
            background-color: green;
        }
        

    </style>
</head>
<body>
    <div class="fix-box">
        <div class="parent-box">
            <div id="box1" class="child-box"></div>
            <div id="box2" class="child-box"></div>
        </div>
    </div>

    <script>

        document.getElementById("box1").style.display="none";

    </script>
</body>
</html>
